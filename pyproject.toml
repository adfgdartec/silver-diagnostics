[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-diagnostics"
version = "1.2.2"
description = "Visual, framework-neutral neural-network and training diagnostics for Silver."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Silver Contributors"}]
keywords = ["machine-learning", "diagnostics", "neural-networks", "visualization", "debugging", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/adfgdartec/silver-diagnostics"
Repository = "https://github.com/adfgdartec/silver-diagnostics"
Issues = "https://github.com/adfgdartec/silver-diagnostics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
silver_diagnostics = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
